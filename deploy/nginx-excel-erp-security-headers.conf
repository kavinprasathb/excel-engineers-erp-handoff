# Security headers for <LIVE_DOMAIN> ONLY.
# Install to: /etc/nginx/snippets/excel-erp-security-headers.conf
#
# Included at server level AND inside every location that has its own
# add_header, because an add_header in a location replaces (does not extend)
# the server-level ones.
#
# HSTS deliberately has no includeSubDomains/preload: other apps share the
# parent domain. Browsers ignore HSTS over plain http, so it is harmless on :80.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
