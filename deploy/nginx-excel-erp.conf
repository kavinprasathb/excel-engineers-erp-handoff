# /etc/nginx/sites-available/<LIVE_DOMAIN>
# certbot adds the SSL directives and the :443 server block.
#
# NOTE: certbot edits the INSTALLED copy on the server, so it differs from this
# file. Never overwrite it with this file; merge (see docs/runbook.md,
# "Applying nginx hardening"). Requires the snippet
# deploy/nginx-excel-erp-security-headers.conf installed at
# /etc/nginx/snippets/excel-erp-security-headers.conf.

# Top-level = http context (sites-enabled is included inside http {}).
# Unique zone name so it cannot collide with the other apps on this box.
limit_req_zone $binary_remote_addr zone=excelerp_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;          # Let's Encrypt may validate over IPv6
    server_name <LIVE_DOMAIN>;

    server_tokens off;
    include /etc/nginx/snippets/excel-erp-security-headers.conf;

    root /var/www/excel-erp;
    index index.html;

    # Spreadsheet imports. Larger than the app's own 10 MB cap so the API can
    # return a clean error rather than nginx cutting the upload off.
    client_max_body_size 12m;

    # Brute-force brake on sign-in: 10/min per IP, small burst.
    location = /api/auth/login {
        limit_req zone=excelerp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # The SPA and the API share one origin, which is what keeps the session
    # cookie same-site and makes CORS unnecessary.
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An import of a few thousand rows can hold the request open.
        proxy_read_timeout 300s;
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/excel-erp-security-headers.conf;
    }

    # index.html must never be cached, or a deploy leaves browsers asking for
    # asset files that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/excel-erp-security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
